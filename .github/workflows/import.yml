name: Import Questions to Supabase

on:
  workflow_dispatch:
    inputs:
      budget_seconds:
        description: 'Work budget in seconds (default 600 = 10 min)'
        required: false
        default: '600'
      batch_size:
        description: 'Rows per request (default 500)'
        required: false
        default: '500'

concurrency:
  group: import-questions
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RUN_BUDGET: ${{ inputs.budget_seconds }}
          BATCH_SIZE: ${{ inputs.batch_size }}
        run: python js/import_to_supabase.py

      - name: Commit progress
        if: always()
        run: |
          git config user.name "import-bot"
          git config user.email "bot@users.noreply.github.com"
          git add jd/import_progress.json
          if git diff --staged --quiet; then
            echo "No progress change."
            exit 0
          fi
          git commit -m "chore(import): batch $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 2
          done
          exit 1

      - name: Verify count
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python js/import_to_supabase.py --verify

