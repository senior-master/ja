name: Deploy Supabase Edge Function (API)

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via Management API
        run: |
          curl -s -X POST "https://api.supabase.com/v1/projects/${{ secrets.SUPABASE_PROJECT_ID }}/functions/deploy?slug=ai-tutor" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            -H "content-type: multipart/form-data" \
            -F 'metadata={"entrypoint_path":"index.ts","name":"ai-tutor","verify_jwt":false}' \
            -F "file=@supabase/functions/ai-tutor/index.ts"
